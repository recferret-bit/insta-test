# Production-like stack (F-INFRA-03/04) — docs/specs/infra/01-docker-compose.md
# Per-wave isolation: distinct COMPOSE_PROJECT_NAME + WEB_HOST_PORT/API_HOST_PORT (WAVE_PORT_BASE+0/+1).
# No container_name / fixed network or volume names on purpose: compose namespaces them per project.
name: ${COMPOSE_PROJECT_NAME:-insta}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insta}
      POSTGRES_USER: ${POSTGRES_USER:-insta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    # no host ports: db is internal-only (docker-compose.dev.yml publishes DB_HOST_PORT for local dev)

  # `web` is declared before `api` on purpose: wave-compose-deploy assigns host-port offsets in
  # declaration order, so this keeps web at WAVE_PORT_BASE+0 and api at +1 (infra/01 port table).
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on:
      api: { condition: service_healthy }
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
    ports:
      - "${WEB_HOST_PORT:-18000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [edge]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-insta}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-insta}
      PUBLIC_URL: ${PUBLIC_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      MEDIA_DIR: /data/media
      MIGRATE_ON_START: "true"
      JOBS_ENABLED: "true"
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GIT_SHA: ${GIT_SHA:-dev}
    volumes:
      - media:/data/media
    ports:
      - "${API_HOST_PORT:-18001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    networks: [internal, edge]

volumes:
  db-data:
  media:

networks:
  internal:
    internal: true
  edge:
